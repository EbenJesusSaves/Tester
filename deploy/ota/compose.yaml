name: xprem-ota
services:
  ota:
    image: xprem-ota:local
    build:
      context: ../..
      dockerfile: deploy/ota/Dockerfile
      args:
        OTA_BASE_IMAGE: ${OTA_BASE_IMAGE:-xprem-ota-base:local}
    restart: unless-stopped
    init: true
    user: "100:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:${OTA_PORT:-3000}:3000"
    environment:
      BASE_URL: ${OTA_BASE_URL:-http://localhost:3000}
      PORT: "3000"
      BIND_TO_ADDRESS: "0.0.0.0"
      STORAGE_MODE: local
      LOCAL_BUCKET_BASE_PATH: /app/updates
      USE_DASHBOARD: "true"
      ADMIN_EMAIL: ${OTA_ADMIN_EMAIL:?Run scripts/ota-init.py first}
      CACHE_MODE: redis
      CACHE_KEY_PREFIX: ${OTA_CACHE_PREFIX:-xprem-ota-local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_MAX_CONNS: "15"
      DB_MIN_CONNS: "2"
      SKIP_LEGACY_APP_ID_FALLBACK: "true"
      DISABLE_TELEMETRY: "true"
      DISABLE_DEVICE_TELEMETRY: "true"
      ENABLE_PREVENT_CDN_REDIRECTION_HEADER: "false"
      BUNDLE_DIFFING: "false"
    secrets:
      - jwt_secret
      - master_key
      - admin_password
      - postgres_password
      - redis_password
    volumes:
      - assets:/app/updates
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/ready]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    networks: [backend, egress]

  postgres:
    # PostgreSQL 17.11, pinned manifest digest; update through reviewed dependency PRs.
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: ota
      POSTGRES_DB: ota
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ota -d ota"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    networks: [backend]

  redis:
    # Redis 7.4.11; the generated config supplies authentication without argv secrets.
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    user: "999:1000"
    command: [redis-server, /run/secrets/redis_config]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    secrets: [redis_config, redis_password]
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m,uid=999,gid=1000
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

networks:
  backend:
    internal: true
  egress: {}
volumes:
  postgres: {}
  assets: {}
secrets:
  jwt_secret:
    file: .secrets/jwt_secret
  master_key:
    file: .secrets/master_key
  admin_password:
    file: .secrets/admin_password
  postgres_password:
    file: .secrets/postgres_password
  redis_password:
    file: .secrets/redis_password
  redis_config:
    file: .secrets/redis_config
